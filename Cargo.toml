[package]
name = "loraterm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "LoRa-mesh terminal emulator daemon bridging MeshCore DMs to per-peer bash PTYs."
license = "MIT"

[[bin]]
name = "loraterm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-util", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "stream", "rustls-tls"] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
eventsource-stream = "0.2"
futures-util = "0.3"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arc-swap = "1"
strip-ansi-escapes = "0.2"
governor = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
nonzero_ext = "0.3"
humantime-serde = "1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
